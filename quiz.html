<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>الاختبار العملي | منصة تعليم التداول</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --gold:#B8860B;--gold-g:linear-gradient(135deg,#B8860B,#D4A017);
      --bg:#f8f6f1;--white:#fff;--text:#1a1a2e;--muted:#6b7280;
      --border:rgba(184,134,11,.18);--green:#059669;--red:#dc2626;--blue:#3b82f6;
    }
    body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

    /* NAV */
    nav{background:#fff;border-bottom:1px solid var(--border);padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 14px rgba(0,0,0,.06)}
    .nav-logo{display:flex;align-items:center;gap:8px;text-decoration:none}
    .nav-logo-icon{width:36px;height:36px;background:var(--gold-g);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1rem}
    .nav-logo-name{font-weight:900;font-size:.9rem;background:var(--gold-g);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .nav-back{padding:7px 16px;background:rgba(184,134,11,.08);border:1px solid var(--border);border-radius:10px;font-family:'Cairo',sans-serif;font-size:.82rem;font-weight:700;color:var(--gold);cursor:pointer;text-decoration:none;transition:all .2s}
    .nav-back:hover{background:rgba(184,134,11,.16)}

    /* LAYOUT */
    .page{max-width:1100px;margin:0 auto;padding:28px 20px 80px}

    /* SCHOOL HEADER */
    .school-banner{border-radius:18px;padding:22px 28px;margin-bottom:24px;display:flex;align-items:center;gap:16px}
    .school-banner.classic{background:linear-gradient(135deg,#e8f4ff,#dbeafe);border:1px solid rgba(59,130,246,.2)}
    .school-banner.advanced{background:linear-gradient(135deg,#fffbeb,#fef3c7);border:1px solid rgba(184,134,11,.2)}
    .sb-icon{font-size:2.5rem}
    .sb-info h2{font-size:1.2rem;font-weight:900;margin-bottom:4px}
    .sb-info p{color:var(--muted);font-size:.85rem}
    .sb-right{margin-right:auto;display:flex;align-items:center;gap:12px}
    .quiz-progress{text-align:center}
    .qp-num{font-size:1.5rem;font-weight:900;background:var(--gold-g);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .qp-lbl{font-size:.72rem;color:var(--muted)}
    .prog-bar-wrap{width:120px;height:6px;background:rgba(0,0,0,.08);border-radius:999px;overflow:hidden;margin-top:4px}
    .prog-bar{height:100%;background:var(--gold-g);border-radius:999px;transition:width .4s ease}

    /* API KEY CARD */
    .api-setup{background:#fff;border:1.5px solid rgba(59,130,246,.25);border-radius:16px;padding:20px 24px;margin-bottom:24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
    .api-icon{font-size:1.6rem;flex-shrink:0}
    .api-text{flex:1;min-width:200px}
    .api-text h3{font-size:.95rem;font-weight:900;margin-bottom:4px;color:var(--blue)}
    .api-text p{font-size:.78rem;color:var(--muted);line-height:1.6}
    .api-inp-wrap{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .api-inp{padding:9px 14px;border:1.5px solid rgba(59,130,246,.3);border-radius:10px;font-family:'Cairo',sans-serif;font-size:.82rem;width:280px;outline:none;direction:ltr}
    .api-inp:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.1)}
    .api-save-btn{padding:9px 18px;background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;font-family:'Cairo',sans-serif;font-weight:800;font-size:.82rem;border:none;border-radius:10px;cursor:pointer;white-space:nowrap;transition:all .2s}
    .api-save-btn:hover{box-shadow:0 4px 14px rgba(59,130,246,.4)}
    .api-saved{display:none;padding:6px 14px;background:rgba(5,150,105,.1);color:var(--green);border:1px solid rgba(5,150,105,.2);border-radius:8px;font-size:.8rem;font-weight:700}
    .api-saved.show{display:flex;align-items:center;gap:6px}

    /* MAIN QUIZ GRID */
    .quiz-grid{display:grid;grid-template-columns:1fr;gap:20px;align-items:start;max-width:700px;margin:0 auto}

    /* QUESTION CARD */
    .q-card{background:#fff;border:1px solid var(--border);border-radius:18px;overflow:hidden;position:sticky;top:80px}
    .q-header{padding:16px 20px;border-bottom:1px solid var(--border);background:linear-gradient(135deg,#fffdf5,#fef9e7)}
    .q-step{font-size:.72rem;font-weight:800;color:var(--muted);margin-bottom:4px}
    .q-title{font-size:.98rem;font-weight:900;line-height:1.6}
    .q-body{padding:20px}

    /* MCQ options */
    .mcq-opts{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
    .mcq-opt{display:flex;align-items:center;gap:10px;padding:12px 14px;border:2px solid var(--border);border-radius:11px;cursor:pointer;transition:all .2s;font-size:.88rem;font-weight:600}
    .mcq-opt:hover{border-color:rgba(184,134,11,.4);background:rgba(184,134,11,.04)}
    .mcq-opt.selected{border-color:var(--gold);background:rgba(184,134,11,.08)}
    .mcq-opt.correct{border-color:var(--green);background:rgba(5,150,105,.08);color:var(--green)}
    .mcq-opt.wrong{border-color:var(--red);background:rgba(220,38,38,.06);color:var(--red)}
    .opt-letter{width:26px;height:26px;border-radius:7px;background:rgba(0,0,0,.06);display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:900;flex-shrink:0}
    .mcq-opt.selected .opt-letter{background:var(--gold-g);color:#fff}

    /* Open answer */
    .open-q textarea{width:100%;min-height:90px;padding:12px 14px;border:1.5px solid var(--border);border-radius:11px;font-family:'Cairo',sans-serif;font-size:.88rem;resize:vertical;outline:none;transition:border-color .2s;color:var(--text)}
    .open-q textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,134,11,.1)}

    /* AI Feedback */
    .ai-feedback{display:none;margin-top:14px;border-radius:12px;overflow:hidden;border:1px solid var(--border)}
    .ai-feedback.show{display:block;animation:fadeIn .3s ease}
    @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    .aif-header{padding:10px 16px;display:flex;align-items:center;gap:8px;font-size:.82rem;font-weight:800}
    .aif-header.great{background:rgba(5,150,105,.1);color:var(--green)}
    .aif-header.good{background:rgba(184,134,11,.1);color:var(--gold)}
    .aif-header.review{background:rgba(220,38,38,.06);color:var(--red)}
    .aif-body{padding:12px 16px;font-size:.84rem;line-height:1.8;color:var(--text);background:#fafafa}
    .aif-score{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.75rem;font-weight:900;margin-right:8px}

    /* Buttons */
    .btn-gold{width:100%;padding:13px;background:var(--gold-g);color:#fff;font-family:'Cairo',sans-serif;font-weight:800;font-size:.9rem;border:none;border-radius:12px;cursor:pointer;transition:all .25s;box-shadow:0 4px 16px rgba(184,134,11,.25);display:flex;align-items:center;justify-content:center;gap:8px}
    .btn-gold:hover:not(:disabled){box-shadow:0 8px 24px rgba(184,134,11,.4);transform:translateY(-1px)}
    .btn-gold:disabled{opacity:.5;cursor:not-allowed;transform:none}
    .btn-secondary{width:100%;padding:11px;background:var(--bg);color:var(--text);font-family:'Cairo',sans-serif;font-weight:700;font-size:.88rem;border:1.5px solid var(--border);border-radius:12px;cursor:pointer;transition:all .2s;margin-top:8px}
    .btn-secondary:hover{border-color:var(--gold);color:var(--gold)}

    /* Loading spinner */
    .ai-loading{display:none;flex-direction:column;align-items:center;padding:20px;gap:10px;color:var(--muted);font-size:.84rem}
    .ai-loading.show{display:flex}
    .spinner{width:28px;height:28px;border:3px solid rgba(184,134,11,.2);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* Results */
    .results-card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:32px;text-align:center;display:none}
    .results-card.show{display:block;animation:fadeIn .4s ease}
    .res-icon{font-size:3rem;margin-bottom:12px}
    .res-score-circle{width:100px;height:100px;border-radius:50%;background:var(--gold-g);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;box-shadow:0 8px 28px rgba(184,134,11,.3)}
    .res-score-num{font-size:1.8rem;font-weight:900;color:#fff}
    .res-title{font-size:1.3rem;font-weight:900;margin-bottom:8px}
    .res-msg{color:var(--muted);font-size:.9rem;margin-bottom:24px;line-height:1.7}
    .res-details{display:flex;justify-content:center;gap:28px;margin-bottom:24px}
    .rd-item{text-align:center}
    .rd-num{font-size:1.4rem;font-weight:900}
    .rd-lbl{font-size:.72rem;color:var(--muted)}
    .rd-correct .rd-num{color:var(--green)}
    .rd-wrong .rd-num{color:var(--red)}
    .res-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
    .btn-res{padding:11px 28px;border-radius:11px;font-family:'Cairo',sans-serif;font-weight:800;font-size:.9rem;cursor:pointer;transition:all .2s;border:none}
    .btn-res-primary{background:var(--gold-g);color:#fff;box-shadow:0 4px 14px rgba(184,134,11,.3)}
    .btn-res-primary:hover{box-shadow:0 8px 22px rgba(184,134,11,.45);transform:translateY(-1px)}
    .btn-res-secondary{background:var(--bg);color:var(--text);border:1.5px solid var(--border)}
    .btn-res-secondary:hover{border-color:var(--gold);color:var(--gold)}
  </style>
</head>

<!-- NAV -->
<nav>

    </div>

    <div class="res-msg" id="resMsg"></div>
    <div class="res-details">
      <div class="rd-item rd-correct"><div class="rd-num" id="resCorrect">0</div><div class="rd-lbl">إجابات صحيحة</div></div>
      <div class="rd-item rd-wrong"><div class="rd-num" id="resWrong">0</div><div class="rd-lbl">تحتاج مراجعة</div></div>
    </div>
    <div class="res-actions">
      <button class="btn-res btn-res-primary" onclick="retakeQuiz()">🔄 إعادة الاختبار</button>
      <button class="btn-res btn-res-secondary" onclick="window.location.href='dashboard.html'">← العودة للداشبورد</button>

  </div>

</div><!-- /page -->

/* ════════════════════════════════
   QUIZ ENGINE
════════════════════════════════ */
let questions=[];
let qIdx=0,score=0,wrongCount=0,selectedOpt=null,mcqAnswered=false;

function pickRandom(arr,n){
  const shuffled=[...arr].sort(()=>Math.random()-0.5);
  return shuffled.slice(0,n);
}

async function initQuiz(){
  try{
    questions=await generateQuestions();
  } catch(e){
    const bank=QUESTIONS[SCHOOL]||[];
    questions=pickRandom(bank,Math.min(6,bank.length));
  }
  document.getElementById('genOverlay').style.display='none';
  document.getElementById('quizArea').style.display='block';
  loadQuestion();
}

function loadQuestion(){
  if(qIdx>=questions.length){showResults();return;}
  const q=questions[qIdx];
  const total=questions.length;

  document.getElementById('qStep').textContent=`السؤال ${qIdx+1} من ${total}`;
  document.getElementById('qCurrent').textContent=qIdx+1;
  document.getElementById('qTotal').textContent=total;
  document.getElementById('progBar').style.width=`${(qIdx/total)*100}%`;
  document.getElementById('qText').textContent=q.text;
  // Reset UI
  selectedOpt=null;mcqAnswered=false;
  document.getElementById('aiFeedback').classList.remove('show');
  document.getElementById('aiLoading').classList.remove('show');
  document.getElementById('nextBtn').style.display='none';
  document.getElementById('submitBtn').style.display='flex';
  document.getElementById('submitBtn').disabled=false;
  document.getElementById('submitLabel').textContent='تحقق من الإجابة';

  // MCQ or Open
  if(q.type==='mcq'){
    document.getElementById('mcqArea').style.display='flex';
    document.getElementById('openArea').style.display='none';
    document.getElementById('mcqArea').innerHTML=q.options.map((opt,i)=>`
      <div class="mcq-opt" id="opt-${i}" onclick="selectOpt(${i})">
        <div class="opt-letter">${['أ','ب','ج','د'][i]}</div>
        <span>${opt}</span>
      </div>`).join('');
  } else {
    document.getElementById('mcqArea').style.display='none';
    document.getElementById('openArea').style.display='block';
    document.getElementById('openAnswer').value='';
  }
}

function selectOpt(i){
  if(mcqAnswered)return;
  selectedOpt=i;
  document.querySelectorAll('.mcq-opt').forEach(o=>o.classList.remove('selected'));
  document.getElementById('opt-'+i)?.classList.add('selected');
}

async function submitAnswer(){
  const q=questions[qIdx];
  if(q.type==='mcq'){
    if(selectedOpt===null){alert('اختر إجابة أولاً');return;}
    mcqAnswered=true;
    const correct=selectedOpt===q.correct;
    if(correct)score++;else wrongCount++;
    // Show correct/wrong colors
    document.querySelectorAll('.mcq-opt').forEach((o,i)=>{
      if(i===q.correct)o.classList.add('correct');
      else if(i===selectedOpt&&!correct)o.classList.add('wrong');
    });
    showMCQFeedback(q,correct);
  } else {
    const ans=document.getElementById('openAnswer').value.trim();
    if(ans.length<10){alert('اكتب إجابة أكثر تفصيلاً');return;}
    document.getElementById('submitBtn').disabled=true;
    await evaluateOpenAnswer(q,ans);
  }
  document.getElementById('submitBtn').style.display='none';
  document.getElementById('nextBtn').style.display='block';
}

function showMCQFeedback(q,correct){
  const fb=document.getElementById('aiFeedback');
  const body=document.getElementById('aifBody');
  body.innerHTML=`<strong>${correct?'✅ إجابة صحيحة!':'❌ إجابة غير صحيحة'}</strong><br><br>💡 ${q.explanation}`;
  fb.classList.add('show');
}

async function evaluateOpenAnswer(q,ans){
  document.getElementById('aiLoading').classList.add('show');
  let feedback,isGood=false;

  try{
    const keywords=(q.correctKeywords||[]).join('، ');
    const prompt=`أنت مدرب خبير في التداول. قيّم إجابة المتدرب.

السؤال: ${q.text}
إجابة المتدرب: ${ans}
النموذج الصحيح: ${q.modelAnswer}
الكلمات المفتاحية: ${keywords}

قيّم بـ:
1. الدرجة: (ممتاز/جيد/يحتاج مراجعة)
2. نقاط القوة
3. ما ينقص
4. الشرح الكامل

اكتب بالعربية بشكل مشجع وموجز (5-6 أسطر).`;

    const res=await fetch('https://api.openai.com/v1/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+OPENAI_KEY},
      body:JSON.stringify({model:'gpt-4o-mini',max_tokens:400,messages:[{role:'user',content:prompt}]})
    });
    const data=await res.json();
    feedback=data.choices?.[0]?.message?.content||'';
    if(!feedback) throw new Error('no response');
    isGood=feedback.includes('ممتاز')||feedback.includes('جيد')||feedback.includes('صحيح');
    if(isGood)score++;else wrongCount++;
  } catch(e){
    feedback=fallbackEvaluate(q,ans);
    const pts=evalKeywords(q,ans);
    if(pts>=0.5)score++;else wrongCount++;
    isGood=pts>=0.5;
  }

  document.getElementById('aiLoading').classList.remove('show');
  const fb=document.getElementById('aiFeedback');
  const body=document.getElementById('aifBody');
  body.innerHTML=feedback.replace(/\n/g,'<br>');
  fb.classList.add('show');
}

function evalKeywords(q,ans){
  const kw=q.correctKeywords||[];
  const found=kw.filter(k=>ans.includes(k));
  return found.length/kw.length;
}

function fallbackEvaluate(q,ans){
  const pts=evalKeywords(q,ans);
  if(pts>=0.7){
    return`✅ إجابة ممتازة! تضمّنت معظم النقاط الأساسية.\n\n📌 الإجابة النموذجية:\n${q.modelAnswer}`;
  } else if(pts>=0.4){
    return`👍 إجابة جيدة جزئياً — هناك نقاط مهمة تحتاج إضافة.\n\n📌 الإجابة الكاملة:\n${q.modelAnswer}`;
  } else {
    return`💡 إجابة تحتاج مراجعة — راجع الدروس ذات الصلة.\n\n📌 الإجابة الصحيحة:\n${q.modelAnswer}`;
  }
}

function nextQuestion(){
  qIdx++;
  loadQuestion();
}

function showResults(){
  document.getElementById('quizArea').style.display='none';
  document.getElementById('resultsCard').classList.add('show');
  const total=questions.length;
  const pct=Math.round((score/total)*100);
  document.getElementById('progBar').style.width='100%';
  document.getElementById('resScore').textContent=pct+'%';
  document.getElementById('resCorrect').textContent=score;
  document.getElementById('resWrong').textContent=total-score;

  let icon,title,msg;
  if(pct>=80){
    icon='🏆';title='ممتاز! أداء رائع';
    msg=`حصلت على ${score} من ${total} — إجاباتك تُظهر فهماً عميقاً للمادة. استمر بهذا المستوى!`;
  } else if(pct>=60){
    icon='⭐';title='جيد! على الطريق الصحيح';
    msg=`حصلت على ${score} من ${total} — لديك أساس جيد. راجع الأسئلة التي أخطأت بها وأعد الاختبار.`;
  } else {
    icon='📖';title='تحتاج مراجعة أكثر';
    msg=`حصلت على ${score} من ${total} — لا تقلق! راجع المحاضرات مجدداً وأعد الاختبار. التكرار هو مفتاح النجاح.`;
  }
  document.getElementById('resIcon').textContent=icon;
  document.getElementById('resTitle').textContent=title;
  document.getElementById('resMsg').textContent=msg;
}

function retakeQuiz(){
  qIdx=0;score=0;wrongCount=0;selectedOpt=null;mcqAnswered=false;
  const bank=QUESTIONS[SCHOOL]||[];
  questions=pickRandom(bank,Math.min(6,bank.length));
  generateQuestions().then(aiQ=>{questions=aiQ;}).catch(()=>{});
  document.getElementById('resultsCard').classList.remove('show');
  document.getElementById('quizArea').style.display='block';
  loadQuestion();
}
