<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>نسيت كلمة المرور | 3B Trading</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--navy:#132A57;--navy2:#284D9C;--gold:#D4A03C;--gold2:#B8860B;}
    body{
      font-family:'Cairo',sans-serif;
      background:#FAFAFA;
      min-height:100vh;
      display:flex;align-items:center;justify-content:center;
      padding:24px;
      position:relative;overflow:hidden;
    }
    body::before{
      content:'';position:fixed;inset:0;
      background-image:linear-gradient(rgba(19,42,87,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(19,42,87,.04) 1px,transparent 1px);
      background-size:60px 60px;pointer-events:none;
    }
    .wrap{width:100%;max-width:440px;position:relative;z-index:1;}

    .back-link{
      display:inline-flex;align-items:center;gap:6px;
      color:#8a9ab5;font-size:.82rem;text-decoration:none;
      margin-bottom:24px;transition:color .2s;
    }
    .back-link:hover{color:var(--navy);}

    .card{
      background:rgba(255,255,255,.92);
      backdrop-filter:blur(20px);
      border:1px solid rgba(212,160,60,.2);
      border-radius:24px;
      padding:44px 40px;
      box-shadow:0 20px 60px rgba(19,42,87,.1);
      position:relative;overflow:hidden;
    }
    .card::before{
      content:'';position:absolute;top:0;left:10%;right:10%;height:2px;
      background:linear-gradient(90deg,transparent,var(--gold),var(--gold2),var(--gold),transparent);
    }

    .card-logo{display:flex;align-items:center;gap:10px;margin-bottom:28px;}
    .card-logo img{width:52px;height:52px;object-fit:contain;}
    .card-logo .n{font-size:.72rem;font-weight:800;letter-spacing:2.5px;color:var(--navy);text-transform:uppercase;}
    .card-logo .t{font-size:.58rem;letter-spacing:2px;color:var(--gold2);text-transform:uppercase;margin-top:1px;}

    .card-icon{
      width:56px;height:56px;
      background:linear-gradient(135deg,rgba(212,160,60,.15),rgba(212,160,60,.05));
      border:1.5px solid rgba(212,160,60,.25);
      border-radius:16px;
      display:flex;align-items:center;justify-content:center;
      margin-bottom:18px;
    }
    .card-icon svg{width:26px;height:26px;color:var(--gold2);}
    .card-heading{margin-bottom:28px;}
    .card-heading h2{font-size:1.55rem;font-weight:800;color:var(--navy);margin-bottom:6px;}
    .card-heading p{font-size:.84rem;color:#7a8aaa;line-height:1.7;}

    .field{margin-bottom:18px;}
    label{display:block;font-size:.78rem;font-weight:700;color:var(--navy);letter-spacing:.5px;margin-bottom:7px;text-transform:uppercase;}
    .inp-wrap{position:relative;}
    .inp-icon{position:absolute;right:13px;top:50%;transform:translateY(-50%);color:#a0aec0;pointer-events:none;display:flex;}
    .inp-icon svg{width:16px;height:16px;}
    input[type=text],input[type=email],select,textarea{
      width:100%;padding:13px 42px 13px 14px;
      background:rgba(250,252,255,.9);
      border:1.5px solid rgba(19,42,87,.1);
      border-radius:12px;
      font-family:'Cairo',sans-serif;font-size:.9rem;color:var(--navy);
      outline:none;transition:border-color .25s,box-shadow .25s,background .25s;
    }
    input::placeholder,textarea::placeholder{color:#b0bdd4;}
    input:focus,select:focus,textarea:focus{
      border-color:var(--gold);background:#fff;
      box-shadow:0 0 0 4px rgba(212,160,60,.1);
    }

    .alert{display:none;padding:11px 14px;border-radius:10px;font-size:.83rem;margin-bottom:16px;align-items:center;gap:8px;font-weight:600;}
    .alert.show{display:flex;}
    .alert.error{background:rgba(220,38,38,.07);border:1.5px solid rgba(220,38,38,.2);color:#b91c1c;}
    .alert.success{background:rgba(5,150,105,.07);border:1.5px solid rgba(5,150,105,.25);color:#065f46;}

    .btn{
      width:100%;padding:14px;
      background:linear-gradient(135deg,#0d1e3d,var(--navy),var(--navy2));
      color:#fff;font-family:'Cairo',sans-serif;font-weight:700;font-size:.95rem;
      border:none;border-radius:12px;cursor:pointer;
      box-shadow:0 6px 20px rgba(19,42,87,.3);
      transition:transform .25s,box-shadow .25s;
      position:relative;overflow:hidden;
    }
    .btn::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--gold2),var(--gold),var(--gold2));}
    .btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(19,42,87,.4);}
    .btn:disabled{opacity:.55;cursor:not-allowed;transform:none!important;}
    .spinner{width:17px;height:17px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle;margin-left:6px;}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* Success state */
    .success-view{display:none;text-align:center;padding:20px 0;}
    .success-view.show{display:block;}
    .success-icon{width:72px;height:72px;background:rgba(5,150,105,.1);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;}
    .success-icon svg{width:32px;height:32px;color:#059669;}
    .success-view h3{font-size:1.3rem;font-weight:800;color:var(--navy);margin-bottom:8px;}
    .success-view p{color:#7a8aaa;font-size:.86rem;line-height:1.7;}
  </style>
</head>
<body>
<div class="wrap">
  <a href="login.html" class="back-link">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15,18 9,12 15,6"/></svg>
    العودة لتسجيل الدخول
  </a>

  <div class="card">
    <div class="card-logo">
      <img src="logo.svg" alt="3B Trading"/>
      <div>
        <div class="n">3B Trading</div>
        <div class="t">Build · Believe · Benefit</div>
      </div>
    </div>

    <!-- Form view -->
    <div id="formView">
      <div class="card-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      <div class="card-heading">
        <h2>نسيت كلمة المرور؟</h2>
        <p>أدخل بياناتك وسنرسل طلبك إلى المسؤول لإعادة تعيين كلمة المرور.</p>
      </div>

      <div class="alert error" id="errMsg">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="errText">حدث خطأ، حاول مرة أخرى</span>
      </div>

      <form id="resetForm" autocomplete="off">
        <div class="field">
          <label>اسم المستخدم</label>
          <div class="inp-wrap">
            <span class="inp-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
            <input type="text" id="fUsername" placeholder="أدخل اسم المستخدم" dir="ltr" required/>
          </div>
        </div>
        <div class="field">
          <label>الاسم الكامل</label>
          <div class="inp-wrap">
            <span class="inp-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
            <input type="text" id="fName" placeholder="اسمك الكامل" required/>
          </div>
        </div>
        <div class="field">
          <label>رقم الهاتف</label>
          <div class="inp-wrap">
            <span class="inp-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.37 2 2 0 0 1 3.62 1h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.6a16 16 0 0 0 6 6l.96-.96a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 21.72 16z"/></svg></span>
            <input type="text" id="fPhone" placeholder="رقم هاتفك" dir="ltr" required/>
          </div>
        </div>
        <button type="submit" class="btn" id="submitBtn">إرسال طلب إعادة التعيين</button>
      </form>
    </div>

    <!-- Success view -->
    <div class="success-view" id="successView">
      <div class="success-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20,6 9,17 4,12"/></svg>
      </div>
      <h3>تم إرسال طلبك ✓</h3>
      <p>تم إرسال طلب إعادة تعيين كلمة المرور إلى المسؤول.<br/>سيتواصل معك قريباً على رقم هاتفك.</p>
      <a href="login.html" style="display:inline-block;margin-top:24px;color:var(--gold2);font-weight:700;text-decoration:none;font-size:.88rem;">← العودة لتسجيل الدخول</a>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>
const firebaseConfig = {
  apiKey:"AIzaSyCp4YfzewPiH6XkVHo6Sp86hyy5gB-eUSY",
  authDomain:"luxury-trading-academy.firebaseapp.com",
  projectId:"luxury-trading-academy",
  storageBucket:"luxury-trading-academy.firebasestorage.app",
  messagingSenderId:"247439882691",
  appId:"1:247439882691:web:46a1a83ebceb96596fe576"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ── EmailJS config (set once from admin panel or hardcode here) ──
const EMAILJS_SERVICE  = 'service_3btrading';
const EMAILJS_TEMPLATE_RESET = 'template_reset_pwd';
const EMAILJS_PUBLIC   = 'YOUR_EMAILJS_PUBLIC_KEY';
const ADMIN_EMAIL      = 'albalooshia555@gmail.com';

document.getElementById('resetForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const username = document.getElementById('fUsername').value.trim();
  const name     = document.getElementById('fName').value.trim();
  const phone    = document.getElementById('fPhone').value.trim();
  const btn      = document.getElementById('submitBtn');

  if (!username || !name || !phone) { showErr('يرجى ملء جميع الحقول'); return; }

  btn.disabled = true;
  btn.innerHTML = 'جاري الإرسال... <span class="spinner"></span>';

  const reqData = {
    type: 'password_reset',
    username, name, phone,
    sentAt: Date.now(),
    status: 'pending'
  };

  try {
    // 1. Save to Firestore
    await db.collection('admin_requests').add(reqData);

    // 2. Send email (EmailJS) — will silently skip if not configured
    try {
      emailjs.init(EMAILJS_PUBLIC);
      await emailjs.send(EMAILJS_SERVICE, EMAILJS_TEMPLATE_RESET, {
        to_email:  ADMIN_EMAIL,
        from_name: name,
        username:  username,
        phone:     phone,
        req_type:  'إعادة تعيين كلمة المرور',
        sent_at:   new Date().toLocaleString('ar-SA'),
      });
    } catch(emailErr) { console.warn('EmailJS not configured:', emailErr); }

    // 3. Show success
    document.getElementById('formView').style.display = 'none';
    document.getElementById('successView').classList.add('show');

  } catch(err) {
    console.error(err);
    showErr('حدث خطأ في الاتصال، حاول مرة أخرى');
    btn.disabled = false;
    btn.innerHTML = 'إرسال طلب إعادة التعيين';
  }
});

function showErr(msg) {
  document.getElementById('errText').textContent = msg;
  document.getElementById('errMsg').classList.add('show');
}
</script>
</body>
</html>
