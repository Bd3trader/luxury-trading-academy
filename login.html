<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>تسجيل الدخول | أكاديمية 3B للتداول</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --navy:    #132A57;
      --navy2:   #284D9C;
      --navy3:   #0d1e3d;
      --gold:    #D4A03C;
      --gold2:   #B8860B;
      --gold3:   #f0c060;
      --white:   #FAFAFA;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Cairo', sans-serif;
      background: #FAFAFA;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
    }

    /* ══════════════════════════════════════
       FULL-PAGE BACKGROUND CANVAS LAYER
    ══════════════════════════════════════ */
    #bgCanvas {
      position: fixed; inset: 0; z-index: 0;
      width: 100%; height: 100%;
    }

    /* Huge logo watermark */
    .logo-watermark {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 72vw; height: 72vw;
      max-width: 700px; max-height: 700px;
      z-index: 1;
      opacity: 0.055;
      pointer-events: none;
      will-change: transform;
      transition: transform 0.1s linear;
    }
    .logo-watermark img { width: 100%; height: 100%; object-fit: contain; }

    /* ══════════════════════════════════════
       PAGE LAYOUT
    ══════════════════════════════════════ */
    .page {
      position: relative; z-index: 10;
      display: flex;
      width: 100%;
      min-height: 100vh;
    }

    /* ── LEFT PANEL ── */
    .left-panel {
      flex: 1.15;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 60px 64px;
      position: relative;
    }

    .left-brand {
      display: flex; align-items: center; gap: 14px;
      margin-bottom: 56px;
      opacity: 0;
      animation: fadeUp .6s .1s forwards;
    }
    .left-brand img { width: 58px; height: 58px; object-fit: contain; }
    .left-brand-text .name {
      font-size: .75rem; font-weight: 800; letter-spacing: 3px;
      color: var(--navy); text-transform: uppercase;
    }
    .left-brand-text .tagline {
      font-size: .62rem; letter-spacing: 2.5px;
      color: var(--gold); text-transform: uppercase; margin-top: 2px;
    }

    .left-welcome {
      opacity: 0;
      animation: fadeUp .7s .2s forwards;
    }
    .left-welcome .eyebrow {
      font-size: .7rem; font-weight: 700; letter-spacing: 3.5px;
      color: var(--gold); text-transform: uppercase; margin-bottom: 14px;
      display: flex; align-items: center; gap: 10px;
    }
    .left-welcome .eyebrow::before {
      content: ''; width: 28px; height: 2px;
      background: linear-gradient(90deg, var(--gold), var(--gold3));
      border-radius: 2px;
    }
    .left-welcome h1 {
      font-size: 3.6rem; font-weight: 900; line-height: 1.05;
      color: var(--navy); letter-spacing: -1.5px;
      margin-bottom: 10px;
    }
    .left-welcome h1 em {
      font-style: normal;
      background: linear-gradient(135deg, var(--gold2), var(--gold), var(--gold3));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .left-welcome .sub {
      font-size: 1rem; color: #5a6a8a; font-weight: 400;
      line-height: 1.7; max-width: 360px; margin-bottom: 44px;
    }

    /* Stat cards */
    .stat-cards {
      display: flex; gap: 14px;
      opacity: 0;
      animation: fadeUp .7s .35s forwards;
    }
    .stat-card {
      background: rgba(255,255,255,.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(19,42,87,.08);
      border-radius: 16px;
      padding: 16px 22px;
      box-shadow: 0 4px 20px rgba(19,42,87,.07);
      transition: transform .3s, box-shadow .3s;
    }
    .stat-card:hover { transform: translateY(-3px); box-shadow: 0 8px 28px rgba(19,42,87,.12); }
    .stat-card .num {
      font-size: 1.6rem; font-weight: 900;
      background: linear-gradient(135deg, var(--navy), var(--navy2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .stat-card .num span { color: var(--gold); -webkit-text-fill-color: var(--gold); }
    .stat-card .lbl { font-size: .7rem; color: #8a9ab5; font-weight: 500; margin-top: 2px; letter-spacing: .5px; }

    /* Floating chart card */
    .chart-float {
      margin-top: 30px;
      background: rgba(255,255,255,.8);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(19,42,87,.07);
      border-radius: 18px;
      padding: 18px 22px;
      box-shadow: 0 8px 32px rgba(19,42,87,.08);
      max-width: 340px;
      opacity: 0;
      animation: fadeUp .7s .45s forwards;
      position: relative; overflow: hidden;
    }
    .chart-float::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, var(--gold2), var(--gold), var(--gold3));
    }
    .chart-float-top {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px;
    }
    .chart-float-top .title { font-size: .75rem; font-weight: 700; color: var(--navy); letter-spacing: .5px; }
    .chart-float-top .badge {
      background: rgba(212,160,60,.12); color: var(--gold2);
      font-size: .65rem; font-weight: 700; padding: 3px 10px;
      border-radius: 30px; border: 1px solid rgba(212,160,60,.25);
    }
    .chart-float canvas { width: 100% !important; height: 60px !important; }

    /* ── RIGHT PANEL ── */
    .right-panel {
      flex: .85;
      display: flex; align-items: center; justify-content: center;
      padding: 40px 48px;
      position: relative;
    }

    /* Vertical separator */
    .right-panel::before {
      content: '';
      position: absolute; left: 0; top: 8%; bottom: 8%;
      width: 1px;
      background: linear-gradient(to bottom, transparent, rgba(19,42,87,.1), transparent);
    }

    /* Login card */
    .login-card {
      width: 100%; max-width: 420px;
      background: rgba(255,255,255,.88);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(212,160,60,.22);
      border-radius: 28px;
      padding: 44px 40px;
      box-shadow:
        0 0 0 1px rgba(255,255,255,.5),
        0 24px 48px rgba(19,42,87,.12),
        0 48px 80px rgba(19,42,87,.08),
        inset 0 1px 0 rgba(255,255,255,.9);
      opacity: 0;
      animation: fadeScaleIn .8s .3s cubic-bezier(.22,1,.36,1) forwards;
      position: relative; overflow: hidden;
    }
    .login-card::before {
      content: '';
      position: absolute; top: 0; left: 10%; right: 10%; height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold), var(--gold3), var(--gold), transparent);
    }

    .card-logo {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 28px;
    }
    .card-logo img { width: 44px; height: 44px; object-fit: contain; }
    .card-logo-text .n { font-size: .72rem; font-weight: 800; letter-spacing: 2.5px; color: var(--navy); text-transform: uppercase; }
    .card-logo-text .t { font-size: .58rem; letter-spacing: 2px; color: var(--gold2); text-transform: uppercase; margin-top: 1px; }

    .card-heading { margin-bottom: 28px; }
    .card-heading h2 { font-size: 1.7rem; font-weight: 800; color: var(--navy); letter-spacing: -.5px; margin-bottom: 5px; }
    .card-heading p { font-size: .83rem; color: #7a8aaa; font-weight: 400; }

    /* Fields */
    .field { margin-bottom: 18px; }
    .field label {
      display: block; font-size: .75rem; font-weight: 700;
      color: var(--navy); letter-spacing: .5px; margin-bottom: 8px;
      text-transform: uppercase;
    }
    .inp-wrap { position: relative; }
    .inp-icon {
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      color: #a0aec0; pointer-events: none;
      display: flex; align-items: center;
    }
    .inp-icon svg { width: 16px; height: 16px; }
    input[type=text], input[type=password], input[type=email] {
      width: 100%;
      padding: 13px 44px 13px 14px;
      background: rgba(250,252,255,.9);
      border: 1.5px solid rgba(19,42,87,.1);
      border-radius: 12px;
      font-family: 'Cairo', sans-serif;
      font-size: .9rem; color: var(--navy);
      outline: none;
      transition: border-color .25s, box-shadow .25s, background .25s;
    }
    input::placeholder { color: #b0bdd4; }
    input:focus {
      border-color: var(--gold);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(212,160,60,.1);
    }
    .pwd-toggle {
      position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: #a0aec0; padding: 4px;
      transition: color .2s;
    }
    .pwd-toggle:hover { color: var(--navy); }
    .pwd-toggle svg { width: 16px; height: 16px; }

    /* Options row */
    .options-row {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 22px; margin-top: -4px;
    }
    .remember {
      display: flex; align-items: center; gap: 8px; cursor: pointer;
    }
    .remember input[type=checkbox] { display: none; }
    .check-box {
      width: 16px; height: 16px;
      border: 1.5px solid rgba(19,42,87,.2);
      border-radius: 4px; background: #fff;
      display: flex; align-items: center; justify-content: center;
      transition: all .2s; flex-shrink: 0;
    }
    .remember input:checked + .check-box {
      background: var(--navy); border-color: var(--navy);
    }
    .remember input:checked + .check-box::after {
      content: '✓'; color: #fff; font-size: .65rem; font-weight: 700;
    }
    .remember span { font-size: .78rem; color: #7a8aaa; font-weight: 500; }
    .forgot { font-size: .78rem; color: var(--gold2); font-weight: 600; text-decoration: none; transition: color .2s; }
    .forgot:hover { color: var(--gold); }

    /* Alerts */
    .alert { display:none; padding:10px 14px; border-radius:10px; font-size:.82rem; margin-bottom:16px; align-items:center; gap:8px; font-weight:600; }
    .alert.show { display:flex; }
    .alert.error { background:rgba(220,38,38,.07); border:1.5px solid rgba(220,38,38,.2); color:#b91c1c; }
    .alert.warn  { background:rgba(217,119,6,.07);  border:1.5px solid rgba(217,119,6,.2);  color:#92400e; }

    /* Sign in button */
    .btn-signin {
      width: 100%; padding: 15px;
      background: linear-gradient(135deg, var(--navy3) 0%, var(--navy) 40%, var(--navy2) 100%);
      color: #fff;
      font-family: 'Cairo', sans-serif; font-weight: 700; font-size: .95rem;
      border: none; border-radius: 13px; cursor: pointer;
      position: relative; overflow: hidden;
      transition: transform .25s, box-shadow .25s;
      box-shadow: 0 6px 20px rgba(19,42,87,.35);
      letter-spacing: .5px;
    }
    .btn-signin::before {
      content: '';
      position: absolute; bottom: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, var(--gold2), var(--gold3), var(--gold2));
    }
    .btn-signin::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(212,160,60,.15) 0%, transparent 60%);
      opacity: 0; transition: opacity .3s;
    }
    .btn-signin:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 32px rgba(19,42,87,.45), 0 0 0 1px rgba(212,160,60,.3);
    }
    .btn-signin:hover::after { opacity: 1; }
    .btn-signin:active { transform: translateY(0); }
    .btn-signin:disabled { opacity: .6; cursor: not-allowed; transform: none !important; }
    .btn-content { position: relative; z-index: 1; display: flex; align-items: center; justify-content: center; gap: 8px; }

    /* Divider */
    .divider {
      display: flex; align-items: center; gap: 12px;
      margin: 22px 0; color: #b0bdd4; font-size: .75rem; font-weight: 500;
    }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: rgba(19,42,87,.08); }

    .contact-admin {
      text-align: center; font-size: .8rem; color: #8a9ab5;
    }
    .contact-admin a { color: var(--gold2); font-weight: 600; text-decoration: none; transition: color .2s; }
    .contact-admin a:hover { color: var(--gold); }

    /* ══════════════════════════════════════
       ANIMATIONS
    ══════════════════════════════════════ */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeScaleIn {
      from { opacity: 0; transform: scale(.96) translateY(16px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes float1 { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
    @keyframes float2 { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-14px)} }

    /* Spinner */
    .spinner { width:18px; height:18px; border:2px solid rgba(255,255,255,.3); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg) } }

    /* ══════════════════════════════════════
       RESPONSIVE
    ══════════════════════════════════════ */
    @media (max-width: 900px) {
      body { overflow-y: auto; }
      .page { flex-direction: column; }
      .left-panel { padding: 48px 32px 24px; flex: none; }
      .left-panel::after { display:none; }
      .right-panel { padding: 0 20px 48px; flex: none; }
      .right-panel::before { display:none; }
      .left-welcome h1 { font-size: 2.6rem; }
      .chart-float { display: none; }
    }
    @media (max-width: 520px) {
      .left-panel { padding: 36px 20px 16px; }
      .left-welcome h1 { font-size: 2rem; }
      .stat-cards { display: none; }
      .login-card { padding: 32px 22px; border-radius: 20px; }
      .right-panel { padding: 0 14px 36px; }
    }
  </style>
</head>
<body>

<!-- Background canvas -->
<canvas id="bgCanvas"></canvas>

<!-- Logo watermark -->
<div class="logo-watermark" id="logoWm">
  <img src="logo.svg" alt=""/>
</div>

<!-- Page -->
<div class="page">

  <!-- ═══ CENTER ═══ -->
  <div class="right-panel" style="flex:1;">
    <div class="login-card">

      <!-- Card logo -->
      <div class="card-logo">
        <img src="logo.svg" alt="3B Trading"/>
        <div class="card-logo-text">
          <div class="n">3B Trading</div>
          <div class="t">ابنِ · آمن · استفد</div>
        </div>
      </div>

      <!-- Heading -->
      <div class="card-heading">
        <h2>أهلاً بعودتك</h2>
        <p>ادخل إلى لوحة تحكم التداول الخاصة بك</p>
      </div>

      <!-- Alerts -->
      <div class="alert error" id="errMsg">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        اسم المستخدم أو كلمة المرور غير صحيحة
      </div>
      <div class="alert warn" id="suspMsg">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        حسابك موقوف مؤقتاً — تواصل مع المسؤول
      </div>
      <div class="alert error" id="netMsg">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="1" y1="1" x2="23" y2="23"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55M5 12.55a10.94 10.94 0 0 1 5.17-2.39M10.71 5.05A16 16 0 0 1 22.56 9M1.42 9a15.91 15.91 0 0 1 4.7-2.88M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"/></svg>
        خطأ في الاتصال — تحقق من الإنترنت
      </div>

      <!-- Form -->
      <form id="loginForm" autocomplete="off">
        <div class="field">
          <label>اسم المستخدم</label>
          <div class="inp-wrap">
            <span class="inp-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </span>
            <input type="text" id="username" placeholder="أدخل اسم المستخدم" dir="ltr" autocomplete="username" required/>
          </div>
        </div>
        <div class="field">
          <label>كلمة المرور</label>
          <div class="inp-wrap">
            <span class="inp-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
            <input type="password" id="password" placeholder="••••••••" dir="ltr" autocomplete="current-password" required/>
            <button type="button" class="pwd-toggle" id="eyeBtn" onclick="togglePwd()">
              <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <!-- Options -->
        <div class="options-row">
          <label class="remember">
            <input type="checkbox" id="rememberMe"/>
            <span class="check-box"></span>
            <span>تذكرني</span>
          </label>
          <a href="#" class="forgot">نسيت كلمة المرور؟</a>
        </div>

        <button type="submit" class="btn-signin" id="loginBtn">
          <span class="btn-content">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10,17 15,12 10,7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
            تسجيل الدخول
          </span>
        </button>
      </form>

      <div class="divider">أو</div>

      <div class="contact-admin">
        ليس لديك حساب؟<br/>
        <a href="#contact">تواصل مع المسؤول</a>
      </div>

    </div>
  </div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
/* ════════════════════════════════════════════════════════
   FIREBASE
════════════════════════════════════════════════════════ */
const firebaseConfig = {
  apiKey: "AIzaSyCp4YfzewPiH6XkVHo6Sp86hyy5gB-eUSY",
  authDomain: "luxury-trading-academy.firebaseapp.com",
  projectId: "luxury-trading-academy",
  storageBucket: "luxury-trading-academy.firebasestorage.app",
  messagingSenderId: "247439882691",
  appId: "1:247439882691:web:46a1a83ebceb96596fe576"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
let currentSub = null;

function togglePwd() {
  const inp = document.getElementById('password');
  inp.type = inp.type === 'password' ? 'text' : 'password';
  document.getElementById('eyeIcon').setAttribute('d',
    inp.type === 'password'
      ? 'M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z'
      : 'M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24 M1 1l22 22'
  );
}

function showAlert(id) { document.getElementById(id).classList.add('show'); }
function clearAlerts() { ['errMsg','suspMsg','netMsg'].forEach(id=>document.getElementById(id).classList.remove('show')); }
['username','password'].forEach(id => document.getElementById(id)?.addEventListener('input', clearAlerts));

document.getElementById('loginForm').addEventListener('submit', async function(e) {
  e.preventDefault(); clearAlerts();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="btn-content"><div class="spinner"></div> جاري التحقق...</span>';
  try {
    const snap = await db.collection('subscribers').where('username','==',username).get();
    if (snap.empty) { showAlert('errMsg'); reset(); return; }
    const doc = snap.docs[0];
    const sub = { id: doc.id, ...doc.data() };
    if (sub.password !== password) { showAlert('errMsg'); reset(); return; }
    if (sub.active === false) { showAlert('suspMsg'); reset(); return; }
    currentSub = sub;
    doLogin();
  } catch(err) { console.error(err); showAlert('netMsg'); reset(); }
  function reset() { btn.disabled=false; btn.innerHTML='<span class="btn-content"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10,17 15,12 10,7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>تسجيل الدخول</span>'; }
});

function doLogin() {
  const sub = currentSub;
  db.collection('subscribers').doc(sub.id).update({ isOnline:true, lastSeen:Date.now() }).catch(console.error);
  db.collection('login_sessions').add({ studentId:sub.id, studentName:sub.name, loginTime:Date.now(), logoutTime:null }).catch(console.error);
  sessionStorage.setItem('currentSubscriber', JSON.stringify({...sub, isOnline:true, lastSeen:Date.now()}));
  sessionStorage.setItem('sessionId', 'ses_'+Date.now());
  window.location.href = 'dashboard.html';
}

/* ════════════════════════════════════════════════════════
   BACKGROUND CANVAS — grid + candlesticks + particles
════════════════════════════════════════════════════════ */
(function() {
  const canvas = document.getElementById('bgCanvas');
  const ctx = canvas.getContext('2d');
  let W, H, particles = [], candles = [], tick = 0;

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', () => { resize(); buildScene(); });

  /* Golden particles */
  function Particle() {
    this.reset = function() {
      this.x = Math.random() * W;
      this.y = Math.random() * H;
      this.r = Math.random() * 2 + .5;
      this.vx = (Math.random() - .5) * .3;
      this.vy = (Math.random() - .5) * .3;
      this.alpha = Math.random() * .5 + .1;
      this.da = (Math.random() - .5) * .003;
    };
    this.reset();
  }

  /* ── Generate realistic OHLC price series ── */
  function genPriceSeries(n, startPrice, volatility) {
    const prices = [startPrice];
    for (let i = 1; i < n; i++) {
      const change = (Math.random() - 0.46) * volatility;
      prices.push(Math.max(10, prices[i-1] + change));
    }
    return prices.map((p, i) => {
      const next = prices[i+1] ?? p;
      const open  = p;
      const close = next;
      const wigH  = Math.random() * volatility * 0.6 + volatility * 0.1;
      const wigL  = Math.random() * volatility * 0.6 + volatility * 0.1;
      const high  = Math.max(open, close) + wigH;
      const low   = Math.min(open, close) - wigL;
      return { open, close, high, low };
    });
  }

  /* Chart rows config */
  let chartRows = [];

  function buildScene() {
    particles = [];
    for (let i = 0; i < 55; i++) { const p = new Particle(); particles.push(p); }

    chartRows = [];
    // 3 chart strips: top-left, bottom-left, bottom-right
    const strips = [
      { x: -20,      y: H * 0.08, w: W * 0.48, h: H * 0.28, n: 28, vol: 6,  alpha: 0.09, start: 120 },
      { x: -20,      y: H * 0.62, w: W * 0.45, h: H * 0.30, n: 26, vol: 7,  alpha: 0.08, start: 95  },
      { x: W * 0.55, y: H * 0.58, w: W * 0.52, h: H * 0.35, n: 30, vol: 8,  alpha: 0.09, start: 140 },
    ];

    strips.forEach(s => {
      const series = genPriceSeries(s.n, s.start, s.vol);
      const prices = series.map(c => [c.open, c.close, c.high, c.low]).flat();
      const minP = Math.min(...prices);
      const maxP = Math.max(...prices);
      const range = maxP - minP || 1;
      const pad = 14;
      const gap = s.w / s.n;
      const bw  = Math.max(gap * 0.55, 6);

      const candle = series.map((c, i) => {
        const cx = s.x + i * gap + gap / 2;
        const toY = v => s.y + s.h - pad - ((v - minP) / range) * (s.h - pad * 2);
        return {
          x: cx, bw,
          oY: toY(c.open),  cY: toY(c.close),
          hY: toY(c.high),  lY: toY(c.low),
          bull: c.close >= c.open,
          alpha: s.alpha,
          phase: Math.random() * Math.PI * 2,
          speed: 0.003 + Math.random() * 0.002,
        };
      });
      chartRows.push(candle);
    });
  }
  buildScene();

  function drawGrid() {
    ctx.strokeStyle = 'rgba(19,42,87,0.035)';
    ctx.lineWidth = 1;
    const step = 60;
    for (let x = 0; x < W; x += step) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = 0; y < H; y += step) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
  }

  function drawTrendLine() {
    ctx.save();
    const grad = ctx.createLinearGradient(0, H * .8, W, H * .1);
    grad.addColorStop(0, 'rgba(212,160,60,0)');
    grad.addColorStop(.4, 'rgba(212,160,60,0.12)');
    grad.addColorStop(1, 'rgba(212,160,60,0)');
    ctx.strokeStyle = grad;
    ctx.lineWidth = 1.5;
    ctx.setLineDash([8, 6]);
    ctx.beginPath();
    ctx.moveTo(0, H * .78);
    ctx.bezierCurveTo(W * .3, H * .55, W * .65, H * .25, W, H * .1);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }

  function drawCandles() {
    chartRows.forEach(row => {
      row.forEach(cd => {
        const a = cd.alpha * (0.75 + 0.25 * Math.sin(cd.phase + tick * cd.speed));
        const bullCol  = `rgba(212,160,60,${a})`;
        const bearCol  = `rgba(19,42,87,${a * 0.85})`;
        const col      = cd.bull ? bullCol : bearCol;
        const bodyTop  = Math.min(cd.oY, cd.cY);
        const bodyH    = Math.max(Math.abs(cd.cY - cd.oY), 2);

        // wick
        ctx.save();
        ctx.strokeStyle = col;
        ctx.lineWidth   = 1.2;
        ctx.beginPath();
        ctx.moveTo(cd.x, cd.hY);
        ctx.lineTo(cd.x, cd.lY);
        ctx.stroke();

        // body with gradient
        const grad = ctx.createLinearGradient(cd.x - cd.bw/2, bodyTop, cd.x + cd.bw/2, bodyTop + bodyH);
        if (cd.bull) {
          grad.addColorStop(0, `rgba(240,192,96,${a})`);
          grad.addColorStop(1, `rgba(184,134,11,${a})`);
        } else {
          grad.addColorStop(0, `rgba(40,77,156,${a})`);
          grad.addColorStop(1, `rgba(13,30,61,${a})`);
        }
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.roundRect(cd.x - cd.bw/2, bodyTop, cd.bw, bodyH, 2);
        ctx.fill();

        // thin border on body
        ctx.strokeStyle = cd.bull ? `rgba(212,160,60,${a*0.4})` : `rgba(40,77,156,${a*0.4})`;
        ctx.lineWidth = 0.5;
        ctx.stroke();
        ctx.restore();
      });
    });
  }

  function drawParticles() {
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy;
      p.alpha += p.da;
      if (p.alpha < .05 || p.alpha > .5) p.da *= -1;
      if (p.x < 0 || p.x > W || p.y < 0 || p.y > H) p.reset();

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(212,160,60,${p.alpha})`;
      ctx.fill();
    });
  }

  function drawGlow() {
    const g1 = ctx.createRadialGradient(W*.15, H*.2, 0, W*.15, H*.2, W*.35);
    g1.addColorStop(0, 'rgba(40,77,156,.04)');
    g1.addColorStop(1, 'rgba(40,77,156,0)');
    ctx.fillStyle = g1; ctx.fillRect(0,0,W,H);

    const g2 = ctx.createRadialGradient(W*.85, H*.75, 0, W*.85, H*.75, W*.35);
    g2.addColorStop(0, 'rgba(212,160,60,.04)');
    g2.addColorStop(1, 'rgba(212,160,60,0)');
    ctx.fillStyle = g2; ctx.fillRect(0,0,W,H);
  }

  function loop() {
    ctx.clearRect(0, 0, W, H);
    // White base
    ctx.fillStyle = '#FAFAFA';
    ctx.fillRect(0, 0, W, H);
    drawGlow();
    drawGrid();
    drawTrendLine();
    drawCandles();
    drawParticles();
    tick++;
    requestAnimationFrame(loop);
  }
  loop();
})();

/* ════════════════════════════════════════════════════════
   MINI CHART (left panel)
════════════════════════════════════════════════════════ */
(function() {
  const canvas = document.getElementById('miniChart');
  if (!canvas) return;
  canvas.width = canvas.parentElement.clientWidth - 44;
  canvas.height = 60;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const pts = [48,44,50,42,38,36,32,28,30,26,22,20,18,22,16,14,12];
  const max = Math.max(...pts), min = Math.min(...pts);
  const px = (i) => (i / (pts.length-1)) * W;
  const py = (v) => H - ((v-min)/(max-min)) * (H-8) - 4;

  // Fill
  const fillGrad = ctx.createLinearGradient(0,0,0,H);
  fillGrad.addColorStop(0, 'rgba(212,160,60,.18)');
  fillGrad.addColorStop(1, 'rgba(212,160,60,.0)');
  ctx.beginPath();
  ctx.moveTo(px(0), py(pts[0]));
  pts.forEach((v,i) => { if(i>0) ctx.lineTo(px(i), py(v)); });
  ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath();
  ctx.fillStyle = fillGrad; ctx.fill();

  // Line
  ctx.beginPath();
  ctx.moveTo(px(0), py(pts[0]));
  pts.forEach((v,i) => { if(i>0) ctx.lineTo(px(i), py(v)); });
  ctx.strokeStyle = '#D4A03C'; ctx.lineWidth = 2; ctx.stroke();

  // Last dot
  const lx = px(pts.length-1), ly = py(pts[pts.length-1]);
  ctx.beginPath(); ctx.arc(lx,ly,3,0,Math.PI*2);
  ctx.fillStyle='#D4A03C'; ctx.fill();
})();

/* ════════════════════════════════════════════════════════
   PARALLAX WATERMARK
════════════════════════════════════════════════════════ */
document.addEventListener('mousemove', function(e) {
  const wm = document.getElementById('logoWm');
  if (!wm) return;
  const dx = (e.clientX / window.innerWidth  - .5) * 18;
  const dy = (e.clientY / window.innerHeight - .5) * 18;
  wm.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
});
</script>
