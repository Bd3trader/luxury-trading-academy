<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>دخول المتدربين | منصة تعليم التداول</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--gold:#B8860B;--gold-g:linear-gradient(135deg,#B8860B,#D4A017);--text:#1a1a2e;--muted:#6b7280;--border:rgba(184,134,11,.2);--red:#dc2626;--green:#0a9e78}
    body{font-family:'Cairo',sans-serif;background:linear-gradient(135deg,#f8f6f1,#f0ece3,#e8dfc8);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .wrap{width:100%;max-width:440px}
    .brand{display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;margin-bottom:28px}
    .brand-icon{width:50px;height:50px;background:var(--gold-g);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;box-shadow:0 8px 24px rgba(184,134,11,.3)}
    .brand-name{font-size:1.05rem;font-weight:900;background:var(--gold-g);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .brand-sub{font-size:.72rem;color:var(--muted)}
    .card{background:#fff;border-radius:24px;padding:40px 36px;box-shadow:0 24px 60px rgba(0,0,0,.1);border:1px solid var(--border)}
    .card-top{text-align:center;margin-bottom:28px}
    .card-icon{font-size:2.2rem;margin-bottom:10px}
    .card-title{font-size:1.5rem;font-weight:900;color:var(--text);margin-bottom:6px}
    .card-sub{color:var(--muted);font-size:.88rem;line-height:1.6}
    .field{margin-bottom:18px}
    label{display:block;font-weight:700;font-size:.84rem;color:var(--text);margin-bottom:6px}
    .inp-wrap{position:relative}
    .inp-icon{position:absolute;right:13px;top:50%;transform:translateY(-50%);font-size:1rem;pointer-events:none}
    input[type=text],input[type=password]{width:100%;padding:12px 40px 12px 14px;border:1.5px solid rgba(0,0,0,.1);border-radius:11px;font-family:'Cairo',sans-serif;font-size:.9rem;background:#fafafa;color:var(--text);outline:none;transition:border-color .2s,box-shadow .2s}
    input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,134,11,.12);background:#fff}
    .pwd-eye{position:absolute;left:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:.95rem;color:var(--muted);padding:2px}
    .alert{display:none;padding:10px 14px;border-radius:10px;font-size:.84rem;margin-bottom:16px;align-items:center;gap:8px;font-weight:700}
    .alert.show{display:flex}
    .alert.error{background:#fef2f2;border:1px solid #fecaca;color:var(--red)}
    .alert.warn{background:#fff7ed;border:1px solid #fed7aa;color:#c2410c}
    .alert.success{background:#f0fdf4;border:1px solid #bbf7d0;color:var(--green)}
    .btn{width:100%;padding:14px;background:var(--gold-g);color:#fff;font-family:'Cairo',sans-serif;font-weight:800;font-size:1rem;border:none;border-radius:12px;cursor:pointer;transition:all .25s;box-shadow:0 8px 24px rgba(184,134,11,.3);margin-top:6px}
    .btn:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(184,134,11,.45)}
    .btn:disabled{opacity:.55;cursor:not-allowed;transform:none!important}
    .back{text-align:center;margin-top:18px}
    .back a{color:var(--muted);font-size:.82rem;text-decoration:none}
    .spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle;margin-left:6px}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
<div class="wrap">
  <a href="index.html" class="brand">
    <div class="brand-icon">📈</div>
    <div>
      <div class="brand-name">منصة تعليم التداول</div>
      <div class="brand-sub">بوابة المتدربين</div>
    </div>
  </a>

  <div class="card">
    <div class="card-top">
      <div class="card-icon">🎓</div>
      <div class="card-title">دخول المتدربين</div>
      <div class="card-sub">أدخل بياناتك للوصول إلى مدارسك</div>
    </div>

    <div class="alert error" id="errMsg">⚠️ اسم المستخدم أو كلمة المرور غير صحيحة</div>
    <div class="alert warn" id="suspMsg">🚫 حسابك موقوف مؤقتاً — تواصل مع المسؤول</div>
    <div class="alert error" id="netMsg">⚠️ تعذّر الاتصال — تحقق من الإنترنت وأعد المحاولة</div>

    <form id="loginForm" autocomplete="off">
      <div class="field">
        <label>اسم المستخدم</label>
        <div class="inp-wrap">
          <span class="inp-icon">👤</span>
          <input type="text" id="username" placeholder="اسم المستخدم" dir="ltr" autocomplete="username" required/>
        </div>
      </div>
      <div class="field">
        <label>كلمة المرور</label>
        <div class="inp-wrap">
          <span class="inp-icon">🔑</span>
          <input type="password" id="password" placeholder="••••••••" dir="ltr" autocomplete="current-password" required/>
          <button type="button" class="pwd-eye" id="eyeBtn" onclick="togglePwd()">👁</button>
        </div>
      </div>
      <button type="submit" class="btn" id="loginBtn">دخول ←</button>
    </form>

    <div style="display:flex;align-items:center;gap:12px;margin:22px 0;color:#6b7280;font-size:.8rem">
      <span style="flex:1;height:1px;background:rgba(0,0,0,.08)"></span>ليس لديك حساب؟<span style="flex:1;height:1px;background:rgba(0,0,0,.08)"></span>
    </div>
    <div style="text-align:center;font-size:.84rem"><a href="register.html" style="color:#B8860B;font-weight:700;text-decoration:none">✨ إنشاء حساب جديد ←</a></div>
  </div>
  <div class="back"><a href="index.html">← العودة للموقع الرئيسي</a></div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCp4YfzewPiH6XkVHo6Sp86hyy5gB-eUSY",
  authDomain: "luxury-trading-academy.firebaseapp.com",
  projectId: "luxury-trading-academy",
  storageBucket: "luxury-trading-academy.firebasestorage.app",
  messagingSenderId: "247439882691",
  appId: "1:247439882691:web:46a1a83ebceb96596fe576"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let currentSub = null;

function togglePwd(){
  const inp = document.getElementById('password');
  inp.type = inp.type === 'password' ? 'text' : 'password';
  document.getElementById('eyeBtn').textContent = inp.type === 'password' ? '👁' : '🙈';
}

function showAlert(id){ document.getElementById(id).classList.add('show'); }
function clearAlerts(){ ['errMsg','suspMsg','netMsg'].forEach(id=>document.getElementById(id).classList.remove('show')); }

['username','password'].forEach(id => {
  document.getElementById(id)?.addEventListener('input', clearAlerts);
});

document.getElementById('loginForm').addEventListener('submit', async function(e){
  e.preventDefault();
  clearAlerts();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  btn.innerHTML = 'جاري التحقق... <span class="spinner"></span>';

  try {
    const snap = await db.collection('subscribers').where('username','==',username).get();

    if(snap.empty){
      showAlert('errMsg');
      btn.disabled = false; btn.innerHTML = 'دخول ←';
      return;
    }

    const doc = snap.docs[0];
    const sub = {id: doc.id, ...doc.data()};

    if(sub.password !== password){
      showAlert('errMsg');
      btn.disabled = false; btn.innerHTML = 'دخول ←';
      return;
    }

    if(sub.active === false){
      showAlert('suspMsg');
      btn.disabled = false; btn.innerHTML = 'دخول ←';
      return;
    }

    currentSub = sub;
    doLogin();

  } catch(err){
    console.error('Firebase error:', err);
    showAlert('netMsg');
    btn.disabled = false; btn.innerHTML = 'دخول ←';
  }
});

function doLogin(){
  const sub = currentSub;
  sub.isOnline = true;
  sub.lastSeen = Date.now();
  const sesId = 'ses_' + Date.now();

  // Update Firestore
  db.collection('subscribers').doc(sub.id).update({
    isOnline: true,
    lastSeen: sub.lastSeen
  }).catch(console.error);

  db.collection('login_sessions').add({
    studentId: sub.id,
    studentName: sub.name,
    loginTime: sub.lastSeen,
    logoutTime: null
  }).catch(console.error);

  sessionStorage.setItem('currentSubscriber', JSON.stringify(sub));
  sessionStorage.setItem('sessionId', sesId);
  window.location.href = 'dashboard.html';
}
</script>
</body>
</html>
